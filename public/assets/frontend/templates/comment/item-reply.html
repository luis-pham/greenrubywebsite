<li class="item">
    <div class="clearfix">
        <div class="avatar">
            <div class="image-wrapper position-relative overflow-hidden rounded-circle">
                <img src="/assets/frontend/images/no-avatar.png" alt="{{ fullname }}" class="position-absolute w-100 h-100">
            </div>
        </div>
        <div class="content">
            <p class="fullname">{{ fullname }}</p>
            <p class="mb-2">
                {{#parentFullname}}
                <span class="mention">@{{ parentFullname }}</span>: 
                {{/parentFullname}}
                {{{ content }}}
            </p>
            <div class="function mb-3">
                <a href="#" class="btn-reply mr-3" data-parent-id="{{ id }}">
                    <i class="fas fa-comments"></i> Trả lời
                </a>
                <span class="time btn-tooltip" title="{{ createdAtDisplay }}">{{ createdAtAgo }}</span>
            </div>
        </div>
    </div>
</li>
